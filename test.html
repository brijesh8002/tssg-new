<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter Demo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f8f9fa;
            font-family:Arial, sans-serif;
        }

        .counter-section{
            padding:100px 0;
        }

        .counter-card{
            background:#fff;
            border-radius:20px;
            padding:40px 25px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
            transition:.3s;
            height:100%;
        }

        .counter-card:hover{
            transform:translateY(-8px);
        }

        .counter-number{
            font-size:3rem;
            font-weight:700;
            color:#FB111A;
            line-height:1;
        }

        .counter-title{
            margin-top:12px;
            font-size:1rem;
            color:#555;
        }

        .section-title{
            text-align:center;
            margin-bottom:60px;
        }

        .section-title h2{
            font-size:2.2rem;
            font-weight:700;
        }

        .section-title p{
            color:#777;
        }

        @media(max-width:768px){

            .counter-section{
                padding:70px 0;
            }

            .counter-number{
                font-size:2.3rem;
            }

            .counter-card{
                padding:30px 20px;
            }
        }
    </style>
</head>
<body>

    <section class="counter-section">

        <div class="container">

            <div class="section-title" data-aos="fade-up">
                <h2>Our Achievements</h2>
                <p>Growing every day with trust and quality service.</p>
            </div>

            <div class="row g-4">

                <div class="col-md-3 col-6">
                    <div class="counter-card" data-aos="fade-up">
                        <div
                            class="counter-number purecounter"
                            data-purecounter-start="0"
                            data-purecounter-end="1500"
                            data-purecounter-duration="2">
                        </div>
                        <div class="counter-title">
                            Happy Clients
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="counter-card" data-aos="fade-up" data-aos-delay="100">
                        <div
                            class="counter-number purecounter"
                            data-purecounter-start="0"
                            data-purecounter-end="250"
                            data-purecounter-duration="2">
                        </div>
                        <div class="counter-title">
                            Projects Completed
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="counter-card" data-aos="fade-up" data-aos-delay="200">
                        <div
                            class="counter-number purecounter"
                            data-purecounter-start="0"
                            data-purecounter-end="98"
                            data-purecounter-duration="2">
                        </div>
                        <div class="counter-title">
                            Success Rate %
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="counter-card" data-aos="fade-up" data-aos-delay="300">
                        <div
                            class="counter-number purecounter"
                            data-purecounter-start="0"
                            data-purecounter-end="12"
                            data-purecounter-duration="2">
                        </div>
                        <div class="counter-title">
                            Years Experience
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </section>

    <!-- PureCounter -->
    <script src="https://cdn.jsdelivr.net/npm/@srexi/purecounterjs/dist/purecounter_vanilla.js"></script>

    <!-- AOS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <script>
        new PureCounter();

        AOS.init({
            duration:1000,
            once:true
        });
    </script>

</body>
</html>
